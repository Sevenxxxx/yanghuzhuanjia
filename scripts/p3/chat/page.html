<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>道路养护咨询助手</title>
<style>
  /* 视觉规范：Apple 设计体系（HIG）。系统字体、语义色、系统蓝、连续圆角、
     毛玻璃导航与输入栏、深浅色自适应。改样式请先改这里的 token，不要散落硬编码。 */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-elevated: #ffffff;
    --grouped: #f2f2f7;
    --fill-3: rgba(118, 118, 128, 0.12);
    --fill-4: rgba(118, 118, 128, 0.08);
    --control-fill: #f2f2f7;
    --label: #000000;
    --label-2: rgba(60, 60, 67, 0.6);
    --label-3: rgba(60, 60, 67, 0.3);
    --separator: rgba(60, 60, 67, 0.22);
    --blue: #007aff;
    --blue-press: #0062cc;
    --danger: #d70015;
    --radius-control: 10px;
    --radius-card: 16px;
    --radius-bubble: 18px;
    --nav-height: 44px;
    --max: 44rem;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
            "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-elevated: #1c1c1e;
      --grouped: #1c1c1e;
      --fill-3: rgba(118, 118, 128, 0.24);
      --fill-4: rgba(118, 118, 128, 0.18);
      --control-fill: rgba(118, 118, 128, 0.24);
      --label: #ffffff;
      --label-2: rgba(235, 235, 245, 0.6);
      --label-3: rgba(235, 235, 245, 0.3);
      --separator: rgba(84, 84, 88, 0.6);
      --blue: #0a84ff;
      --blue-press: #409cff;
      --danger: #ff453a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    /* 字号对齐 dsh 对话内容默认值：14px（ui-theme 的 --dsh-content-font-size 默认） */
    font: 14px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    overscroll-behavior-y: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  /* 导航栏：iOS 风格毛玻璃 + 居中标题 */
  .masthead {
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--separator);
  }
  .masthead-inner {
    max-width: var(--max);
    margin: 0 auto;
    height: var(--nav-height);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 16px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .column {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 20px;
  }

  /* 空态 */
  .empty { padding: 12vh 0 0; text-align: center; }
  .empty h2 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .empty p {
    margin: 0 auto 24px;
    max-width: 34em;
    font-size: 13px;
    line-height: 1.5;
    color: var(--label-2);
  }
  .examples { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .examples button {
    cursor: pointer;
    font-size: 13px;
    line-height: 1.4;
    color: var(--label);
    background: var(--fill-4);
    border: 0;
    border-radius: 99px;
    padding: 9px 16px;
    transition: background-color 0.18s ease, transform 0.18s ease;
  }
  .examples button:hover { background: var(--fill-3); }
  .examples button:active { transform: scale(0.98); }

  /* 对话 */
  .turn { display: flex; flex-direction: column; gap: 6px; }
  .turn.user { align-items: flex-end; }
  .user .body {
    max-width: 82%;
    background: var(--blue);
    color: #ffffff;
    padding: 8px 14px;
    border-radius: var(--radius-bubble);
    border-bottom-right-radius: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .assistant .body {
    max-width: 100%;
    padding: 2px 2px 0;
    overflow-wrap: anywhere;
  }
  .assistant .body > :first-child { margin-top: 0; }
  .assistant .body > :last-child { margin-bottom: 0; }
  .assistant .body p { margin: 0 0 10px; }
  .assistant .body h3 {
    margin: 14px 0 6px;
    font-size: 15px;
    line-height: 1.4;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .assistant .body ul,
  .assistant .body ol { margin: 0 0 10px; padding-left: 20px; }
  .assistant .body li { margin-bottom: 4px; }
  .assistant .body li > ul,
  .assistant .body li > ol { margin: 4px 0 0; }
  .assistant .body blockquote {
    margin: 0 0 10px;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--separator);
    color: var(--label-2);
  }
  .assistant .body blockquote p { margin: 0; }
  .assistant .body hr {
    margin: 16px 0;
    border: 0;
    border-top: 1px solid var(--separator);
  }
  .assistant .body a { color: var(--blue); text-decoration: none; }
  .assistant .body a:hover { text-decoration: underline; }
  .assistant .body del { color: var(--label-2); }
  .assistant .body code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
    background: var(--fill-4);
    border-radius: 5px;
    padding: 1px 4px;
  }
  .assistant .body pre {
    margin: 0 0 10px;
    padding: 12px 14px;
    background: var(--grouped);
    border-radius: 12px;
    overflow-x: auto;
  }
  .assistant .body pre code { background: none; padding: 0; }
  .assistant .body strong { font-weight: 600; }
  .assistant .body sub,
  .assistant .body sup { font-size: 0.72em; line-height: 0; }
  .assistant .body sub { vertical-align: sub; }
  .assistant .body sup { vertical-align: super; }
  /* 表格：分组列表样式，窄屏横向滚动 */
  .assistant .body .table-wrap {
    margin: 0 0 10px;
    width: fit-content;
    max-width: 100%;
    overflow-x: auto;
    border-radius: 12px;
    background: var(--grouped);
    -webkit-overflow-scrolling: touch;
  }
  .assistant .body table { width: auto; max-width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
  .assistant .body th,
  .assistant .body td {
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--separator);
  }
  .assistant .body th {
    font-weight: 600;
    color: var(--label-2);
    background: var(--fill-4);
    white-space: nowrap;
  }
  .assistant .body tbody tr:last-child td { border-bottom: 0; }

  figure { margin: 2px 0 0; }
  .turn.user figure { align-self: flex-end; }
  figure img {
    display: block;
    max-width: min(100%, 260px);
    height: auto;
    border-radius: 14px;
  }

  /* 提问卡片：分组列表卡片 */
  .question {
    background: var(--bg-elevated);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: 0 0 0 0.5px var(--separator), 0 6px 20px rgba(0, 0, 0, 0.06);
  }
  .question h3 {
    margin: 0 0 4px;
    font-size: 15px;
    line-height: 1.4;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .question .detail {
    margin: 0 0 10px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--label-2);
    white-space: pre-wrap;
  }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .options button {
    cursor: pointer;
    font-size: 13px;
    line-height: 1.3;
    color: var(--label);
    background: var(--control-fill);
    border: 0;
    border-radius: 12px;
    padding: 10px 14px;
    transition: background-color 0.18s ease, color 0.18s ease;
  }
  .options button:hover { background: var(--fill-3); }
  .options button[aria-pressed="true"] {
    background: var(--blue);
    color: #ffffff;
  }
  .question .other { display: flex; gap: 8px; }
  .question input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
    background: var(--control-fill);
    border: 0;
    border-radius: var(--radius-control);
    padding: 10px 12px;
  }
  .question input[type="text"]::placeholder { color: var(--label-2); }
  .question .submit {
    cursor: pointer;
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: var(--blue);
    border: 0;
    border-radius: var(--radius-control);
    padding: 0 18px;
  }
  .question .submit:hover { background: var(--blue-press); }
  .question .submit:disabled { opacity: 0.4; cursor: default; }

  /* 状态与错误 */
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--label-2);
    padding: 2px 2px 0;
  }
  .status[hidden] { display: none; }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
    animation: beat 1.1s ease-in-out infinite;
  }
  @keyframes beat { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  /* 过程：结束时折叠成一行摘要，思考行可单独展开 */
  .trace { display: flex; flex-direction: column; gap: 3px; padding: 2px 2px 4px; }
  .trace-head {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    color: var(--label-2);
    font-size: 12px;
    line-height: 1.6;
  }
  .trace-head:hover { color: var(--label); }
  .trace-head .chev {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    margin-left: 2px;
    transition: transform 0.18s ease;
  }
  .trace[data-open="false"] .trace-head .chev { transform: rotate(-90deg); }
  .trace-head-text { display: flex; flex-direction: column; min-width: 0; }
  .trace-sub { display: block; font-size: 12px; color: var(--label-3); }
  .trace-sub:empty { display: none; }
  .trace-body { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
  .trace[data-open="false"] .trace-body { display: none; }
  .trace-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 12px;
    line-height: 1.55;
    color: var(--label-2);
  }
  .trace-label { flex: 0 0 auto; }
  .trace-detail {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
  }
  .trace-row.thinking { cursor: pointer; }
  .trace-row.thinking .trace-text {
    flex: 1 1 auto;
    min-width: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .trace-row.thinking.open .trace-text { display: block; overflow: visible; }
  .trace-row.done { opacity: 0.75; }
  .trace-row.failed { color: var(--danger); }

  .error {
    font-size: 13px;
    line-height: 1.45;
    color: var(--danger);
    padding: 2px 2px 0;
  }

  /* 输入栏：底部毛玻璃 + 圆角胶囊 */
  footer {
    flex: 0 0 auto;
    position: sticky;
    bottom: 0;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--separator);
  }
  .composer { max-width: var(--max); margin: 0 auto; }
  .hint {
    margin: 0 0 6px;
    text-align: center;
    font-size: 12px;
    line-height: 1.35;
    color: var(--label-2);
  }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .thumbs[hidden] { display: none; }
  .thumb { position: relative; }
  .thumb img {
    display: block;
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 12px;
  }
  .thumb button {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    font-size: 12px;
    line-height: 1;
    border: 0;
    border-radius: 50%;
    color: var(--label);
    background: var(--bg-elevated);
    box-shadow: 0 0 0 0.5px var(--separator), 0 1px 4px rgba(0, 0, 0, 0.16);
    cursor: pointer;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 6px;
    background: var(--grouped);
    border-radius: 24px;
  }
  textarea {
    flex: 1 1 auto;
    min-width: 0;
    background: none;
    border: 0;
    resize: none;
    padding: 8px 2px;
    min-height: 36px;
    max-height: 40vh;
    line-height: 1.45;
  }
  textarea::placeholder { color: var(--label-2); }
  textarea:focus { outline: none; }
  .icon {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    margin-bottom: 2px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--label-2);
    cursor: pointer;
    transition: background-color 0.18s ease;
  }
  .icon:hover { background: var(--fill-3); }
  .icon svg { width: 20px; height: 20px; }
  .send {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    margin-bottom: 2px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--blue);
    color: #ffffff;
    cursor: pointer;
    transition: background-color 0.18s ease, opacity 0.18s ease;
  }
  .send:hover { background: var(--blue-press); }
  .send.stop { background: var(--label); color: var(--bg); }
  .send.stop:hover { background: var(--label-2); }
  .send svg { width: 18px; height: 18px; }
  .icon:disabled, .send:disabled { opacity: 0.4; cursor: default; }

  :focus-visible {
    outline: 3px solid rgba(0, 122, 255, 0.45);
    outline: 3px solid color-mix(in srgb, var(--blue) 40%, transparent);
    outline-offset: 2px;
  }
  .send:focus-visible, .icon:focus-visible { outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
  @media (max-width: 480px) {
    .empty { padding-top: 8vh; }
    .empty h2 { font-size: 20px; }
    .user .body { max-width: 88%; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <h1>道路养护咨询助手</h1>
  </div>
</header>

<main id="log" aria-live="polite">
  <div class="column" id="column">
    <section class="empty" id="empty">
      <h2>描述病害、部位和已经测到的情况</h2>
      <p>有现场照片就一起发。信息不全也可以先问，会给出条件化的判断和还缺什么。</p>
      <div class="examples">
        <button type="button">沥青路面出现网状裂缝，先做什么？</button>
        <button type="button">边坡坡脚有渗水，怎么判断风险等级？</button>
        <button type="button">帮我列一份桥台日常检查清单</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <form class="composer" id="composer">
    <div class="thumbs" id="thumbs" hidden></div>
    <p class="hint">AI可能会出错。请核查重要信息。</p>
    <div class="row">
      <button class="icon" id="pick" type="button" title="添加图片" aria-label="添加图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="说说情况，或粘贴／拖入照片" aria-label="输入内容"></textarea>
      <button class="send" id="send" type="submit" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M6 11l6-6 6 6"></path>
        </svg>
      </button>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </form>
</footer>

<script>
(() => {
  const log = document.getElementById('log');
  const column = document.getElementById('column');
  const empty = document.getElementById('empty');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const pick = document.getElementById('pick');
  const file = document.getElementById('file');
  const thumbs = document.getElementById('thumbs');

  let transcript = [];
  let images = [];
  let busy = false;
  let userStopped = false;
  let statusRow = null;
  let traceBox = null;
  let sessionId = null;

  const SEND_ICON = sendBtn.innerHTML;
  const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'
    + '<rect x="7" y="7" width="10" height="10" rx="2.5"></rect></svg>';

  // 运行中：发送键变成停止键，图片按钮禁用
  function setBusyMode(on) {
    busy = on;
    sendBtn.classList.toggle('stop', on);
    sendBtn.innerHTML = on ? STOP_ICON : SEND_ICON;
    sendBtn.title = on ? '停止' : '发送';
    sendBtn.setAttribute('aria-label', on ? '停止' : '发送');
    pick.disabled = on;
  }

  async function stopTurn() {
    userStopped = true;
    setStatus('正在停止…');
    try {
      await fetch('/api/stop', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
    } catch (error) {
      // 连接断了 SSE 自己也会结束，这里不额外提示
    }
  }

  const escape = (text) => text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  // 排版器：支持模型实际会写的 Markdown 子集。完整清单见 ADR 0004「渲染能力」。
  // 顺序固定为：整体转义 → 白名单标签 → 链接/图片 → 行内标记；代码块内容保持原样。
  const SAFE_URL = /^(https?:\/\/|mailto:)/i;
  const URL_SAFE_CHARS = /^[^\s"'<>]+$/;

  const anchor = (label, url) => {
    const target = SAFE_URL.test(url) && URL_SAFE_CHARS.test(url)
      ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>'
      : null;
    return target || label + '（' + url + '）';
  };

  const inline = (s) => {
    // 行内代码先占位，避免里面的标记被继续解析
    const codes = [];
    let text = s.replace(/`([^`]+)`/g, (_, code) => {
      codes.push(code);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    // 只放开白名单标签：文本已整体转义，能还原的只有这些结构
    text = text
      .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
      .replace(/&lt;(\/?)(sub|sup|b|strong|i|em|del)&gt;/gi, '<$1$2>');
    // 图片语法不自动加载远程资源（会泄露来源 IP），降级成链接
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) => anchor(alt || '图片', url));
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => anchor(label, url));
    text = text
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w])__([^_\n]+)__(?!\w)/g, '$1<strong>$2</strong>')
      .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return text.replace(/\u0000(\d+)\u0000/g, (_, index) => '<code>' + codes[Number(index)] + '</code>');
  };

  const splitRow = (line) => line.replace(/^\s*\|/, '').replace(/\|\s*$/, '')
    .split(/(?<!\\)\|/).map((cell) => cell.trim().replace(/\\\|/g, '|'));
  const isTableRow = (line) => /^\s*\|.*\|\s*$/.test(line);
  const isDivider = (line) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(line) && line.includes('-');
  const isFence = (line) => /^\s*(```|~~~)/.test(line);
  const isHr = (line) => /^\s*([-*_])(\s*\1){2,}\s*$/.test(line);
  const isQuote = (line) => /^\s*&gt;/.test(line);

  const format = (text) => {
    const lines = escape(String(text ?? '')).split('\n');
    const indentOf = (line) => line.length - line.trimStart().length;
    let html = '';
    let code = false;
    let listStack = [];   // [{ tag, indent }]
    let quote = [];

    const closeItem = () => {
      const top = listStack[listStack.length - 1];
      if (top && top.liOpen) { html += '</li>'; top.liOpen = false; }
    };
    const closeLists = () => {
      while (listStack.length) {
        closeItem();
        html += '</' + listStack.pop().tag + '>';
      }
    };
    const flushQuote = () => {
      if (!quote.length) return;
      html += '<blockquote><p>' + quote.map((line) => inline(line)).join('<br>') + '</p></blockquote>';
      quote = [];
    };
    const closeAll = () => { closeLists(); flushQuote(); };

    for (let i = 0; i < lines.length; i += 1) {
      const raw = lines[i];

      if (isFence(raw)) {
        closeAll();
        html += code ? '</code></pre>' : '<pre><code>';
        code = !code;
        continue;
      }
      if (code) { html += raw + '\n'; continue; }

      if (!raw.trim()) { closeAll(); continue; }

      if (isHr(raw) && !isTableRow(lines[i + 1] || '')) { closeAll(); html += '<hr>'; continue; }

      if (isTableRow(raw) && isDivider(lines[i + 1] || '')) {
        closeAll();
        const head = splitRow(raw);
        const rows = [];
        i += 2;
        while (i < lines.length && isTableRow(lines[i])) { rows.push(splitRow(lines[i])); i += 1; }
        i -= 1;
        html += '<div class="table-wrap"><table><thead><tr>'
          + head.map((cell) => '<th>' + inline(cell) + '</th>').join('')
          + '</tr></thead><tbody>'
          + rows.map((row) => '<tr>' + head.map((_, index) => '<td>' + inline(row[index] || '') + '</td>').join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (isQuote(raw)) {
        closeLists();
        quote.push(raw.replace(/^\s*&gt;\s?/, ''));
        continue;
      }
      flushQuote();

      const line = raw.trim();
      if (/^#{1,6}\s+/.test(line)) {
        closeLists();
        html += '<h3>' + inline(line.replace(/^#{1,6}\s+/, '')) + '</h3>';
        continue;
      }

      const ordered = /^\s*(\d+)[.)]\s+(.*)$/.exec(raw);
      const bullet = /^\s*([-*•])\s+(.*)$/.exec(raw);
      const item = ordered ? { tag: 'ol', content: ordered[2] } : (bullet ? { tag: 'ul', content: bullet[2] } : null);
      if (item) {
        const indent = indentOf(raw);
        const top = () => listStack[listStack.length - 1];
        // 缩进回退：关掉更深的列表与它们所属的 <li>
        while (listStack.length && indent < top().indent) {
          closeItem();
          html += '</' + listStack.pop().tag + '>';
        }
        const current = top();
        if (!current || indent > current.indent) {
          // 更深：新列表嵌进上一级未关闭的 <li>，回到外层时仍是同一个列表
          html += '<' + item.tag + '>';
          listStack.push({ tag: item.tag, indent, liOpen: false });
        } else if (current.tag !== item.tag) {
          closeItem();
          html += '</' + listStack.pop().tag + '><' + item.tag + '>';
          listStack.push({ tag: item.tag, indent, liOpen: false });
        } else {
          closeItem();
        }
        const task = /^\[([ xX])\]\s*(.*)$/.exec(item.content);
        const content = task ? (task[1].trim() ? '☑ ' : '☐ ') + task[2] : item.content;
        html += '<li>' + inline(content);
        top().liOpen = true;
        continue;
      }

      closeLists();
      html += '<p>' + inline(line) + '</p>';
    }

    closeAll();
    if (code) html += '</code></pre>';
    return html;
  };

  // 自己发消息时一定跳到底；回答流式追加时只在你本来就贴着底部时才跟随，
  // 手动往上翻过就不再把你拽回去。
  let followBottom = true;
  log.addEventListener('scroll', () => {
    followBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 160;
  });
  const scrollDown = (force) => {
    if (!force && !followBottom) return;
    followBottom = true;
    log.scrollTop = log.scrollHeight;
  };

  function turnNode(turn) {
    const wrap = document.createElement('div');
    wrap.className = 'turn ' + turn.role;
    const body = document.createElement('div');
    body.className = 'body';
    if (turn.role === 'assistant') body.innerHTML = format(turn.text || '');
    else body.textContent = turn.text || '';
    wrap.appendChild(body);
    for (const image of turn.images || []) {
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = image;
      img.alt = '附带的现场照片';
      fig.appendChild(img);
      wrap.appendChild(fig);
    }
    return wrap;
  }

  function render() {
    column.innerHTML = '';
    if (!transcript.length) { column.appendChild(empty); return; }
    for (const turn of transcript) column.appendChild(turnNode(turn));
    scrollDown(true);
  }

  function setStatus(text) {
    if (!text) { if (statusRow) { statusRow.remove(); statusRow = null; } return; }
    if (!statusRow) {
      statusRow = document.createElement('div');
      statusRow.className = 'status';
      statusRow.innerHTML = '<span class="dot" aria-hidden="true"></span><span></span>';
      column.appendChild(statusRow);
    }
    statusRow.lastElementChild.textContent = text;
    scrollDown();
  }

  function appendTurn(turn) {
    transcript.push(turn);
    if (column.contains(empty)) column.removeChild(empty);
    column.appendChild(turnNode(turn));
    if (statusRow) column.appendChild(statusRow);
    scrollDown();
  }

  // 过程行：上下文注入、思考、工具调用。结束时折叠成一行摘要，思考行可单独展开。
  const KIND_WORDS = {
    '运行命令': '命令', '读取': '文件', '加载技能': '技能', '搜索内容': '检索', '查找文件': '查找',
    '写入': '写入', '修改': '修改', '联网查询': '联网', '生成文件': '生成文件',
    '确认工作目录': '工作目录', '提问': '提问', '更新计划': '计划',
  };
  let traceStartedAt = 0;
  let traceTimer = null;
  let traceKinds = new Map();

  function elapsedText() {
    const seconds = Math.max(1, Math.round((Date.now() - traceStartedAt) / 1000));
    if (seconds < 60) return seconds + ' 秒';
    return Math.floor(seconds / 60) + ' 分 ' + (seconds % 60) + ' 秒';
  }

  function ensureTrace() {
    if (traceBox) return traceBox;
    traceBox = document.createElement('div');
    traceBox.className = 'trace';
    traceBox.dataset.open = 'true';
    traceBox.dataset.state = 'running';
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'trace-head';
    head.setAttribute('aria-expanded', 'true');
    head.innerHTML = '<span class="trace-head-text"><span class="trace-title">正在执行…</span>'
      + '<span class="trace-sub"></span></span>'
      + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'
      + '<path d="M6 9l6 6 6-6"></path></svg>';
    head.onclick = () => {
      const open = traceBox.dataset.open !== 'true';
      traceBox.dataset.open = open ? 'true' : 'false';
      head.setAttribute('aria-expanded', String(open));
    };
    const body = document.createElement('div');
    body.className = 'trace-body';
    traceBox.append(head, body);
    column.appendChild(traceBox);
    traceTimer = setInterval(() => {
      if (traceBox && traceBox.dataset.state === 'running') {
        traceBox.querySelector('.trace-title').textContent = '正在执行… 已用 ' + elapsedText();
      }
    }, 1000);
    return traceBox;
  }

  function finishTrace(failed) {
    if (traceTimer) { clearInterval(traceTimer); traceTimer = null; }
    if (!traceBox || traceBox.dataset.state !== 'running') return;
    traceBox.dataset.state = failed ? 'failed' : 'done';
    const used = [...traceKinds.entries()].slice(0, 4);
    const summary = used.length
      ? '执行了' + used.map(([word, count]) => (count > 1 ? word + ' ×' + count : word)).join('、')
        + (traceKinds.size > used.length ? ' 等' : '')
      : '完成';
    traceBox.querySelector('.trace-title').textContent =
      (failed ? '已中止' : '已完成') + '，用时 ' + elapsedText();
    traceBox.querySelector('.trace-sub').textContent = summary;
    traceBox.dataset.open = 'false';
    traceBox.querySelector('.trace-head').setAttribute('aria-expanded', 'false');
  }

  function addTrace(payload) {
    if (payload.kind === 'tool-result') {
      const row = traceBox && traceBox.querySelector('[data-call-id="' + payload.callId + '"]');
      if (row) row.classList.add('done');
      return;
    }
    const row = document.createElement('div');
    row.className = 'trace-row' + (payload.kind === 'thinking' ? ' thinking' : '');
    if (payload.kind === 'context') {
      row.innerHTML = '<span class="trace-label"></span>';
      row.firstChild.textContent = payload.label || '上下文注入';
    } else if (payload.kind === 'thinking') {
      row.innerHTML = '<span class="trace-label">思考</span><span class="trace-text"></span>';
      row.lastChild.textContent = payload.text || '';
      row.title = '点击展开或收起';
      row.onclick = () => row.classList.toggle('open');
    } else {
      row.innerHTML = '<span class="trace-label"></span><span class="trace-detail"></span>';
      row.firstChild.textContent = payload.label || '工具';
      row.lastChild.textContent = payload.detail || '';
      if (payload.callId) row.dataset.callId = payload.callId;
      const word = KIND_WORDS[payload.label] || payload.label;
      if (word) traceKinds.set(word, (traceKinds.get(word) || 0) + 1);
    }
    ensureTrace().querySelector('.trace-body').appendChild(row);
    scrollDown();
  }

  function showError(message) {
    const row = document.createElement('div');
    row.className = 'error';
    row.textContent = message;
    column.appendChild(row);
    scrollDown();
  }

  // ---------- 图片
  const addFiles = (files) => {
    for (const item of files) {
      if (!/^image\/(png|jpeg|webp|gif)$/.test(item.type)) continue;
      const reader = new FileReader();
      reader.onload = () => {
        images.push({ mimeType: item.type, dataUrl: String(reader.result) });
        renderThumbs();
      };
      reader.readAsDataURL(item);
    }
  };

  function renderThumbs() {
    thumbs.innerHTML = '';
    thumbs.hidden = images.length === 0;
    images.forEach((image, index) => {
      const box = document.createElement('div');
      box.className = 'thumb';
      const img = document.createElement('img');
      img.src = image.dataUrl;
      img.alt = '待发送的图片';
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label', '移除这张图片');
      remove.onclick = () => { images.splice(index, 1); renderThumbs(); };
      box.append(img, remove);
      thumbs.appendChild(box);
    });
  }

  pick.onclick = () => file.click();
  file.onchange = () => { addFiles(file.files); file.value = ''; };
  input.addEventListener('paste', (event) => {
    const items = [...(event.clipboardData?.items || [])];
    const files = items.filter((i) => i.kind === 'file').map((i) => i.getAsFile()).filter(Boolean);
    if (files.length) { event.preventDefault(); addFiles(files); }
  });
  for (const type of ['dragover', 'drop']) {
    form.addEventListener(type, (event) => {
      event.preventDefault();
      if (type === 'drop' && event.dataTransfer?.files?.length) addFiles(event.dataTransfer.files);
    });
  }

  // ---------- 发送
  const frames = (buffer) => {
    const out = [];
    let index;
    while ((index = buffer.indexOf('\n\n')) !== -1) {
      const raw = buffer.slice(0, index);
      buffer = buffer.slice(index + 2);
      let name = 'message', data = '';
      for (const line of raw.split('\n')) {
        if (line.startsWith('event: ')) name = line.slice(7).trim();
        else if (line.startsWith('data: ')) data += line.slice(6);
      }
      out.push({ name, data });
    }
    return { out, rest: buffer };
  };

  async function submit() {
    if (busy) { await stopTurn(); return; }
    if (!sessionId) { showError('会话还没准备好，刷新一次页面'); return; }
    const text = input.value.trim();
    if (!text && !images.length) return;
    const outgoing = images.slice();
    const turn = { role: 'user', text, images: outgoing.map((i) => i.dataUrl) };
    appendTurn(turn);
    scrollDown(true);
    traceBox = null;
    traceKinds = new Map();
    traceStartedAt = Date.now();
    userStopped = false;
    input.value = '';
    input.style.height = 'auto';
    images = [];
    renderThumbs();
    setBusyMode(true);
    setStatus('正在查阅规范与记录…');

    let answer = null;
    let answerNode = null;
    try {
      const response = await fetch('/api/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          text,
          images: outgoing.map((i) => ({ mimeType: i.mimeType, data: i.dataUrl.split(',')[1] })),
        }),
      });
      if (!response.ok || !response.body) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.error || ('请求失败：' + response.status));
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parsed = frames(buffer);
        buffer = parsed.rest;
        for (const frame of parsed.out) {
          const data = frame.data ? JSON.parse(frame.data) : {};
          if (frame.name === 'assistant') {
            setStatus('');
            if (!answer) {
              answer = { role: 'assistant', text: '' };
              transcript.push(answer);
              answerNode = turnNode(answer);
              column.appendChild(answerNode);
            }
            answer.text += data.text || '';
            answerNode.querySelector('.body').innerHTML = format(answer.text);
            scrollDown();
          } else if (frame.name === 'status') {
            setStatus(data.status === 'idle' ? '' : '正在查阅规范与记录…');
          } else if (frame.name === 'trace') {
            addTrace(data);
          } else if (frame.name === 'question') {
            setStatus('');
            renderQuestion(data);
          } else if (frame.name === 'question-cancelled') {
            document.querySelectorAll('.question').forEach((node) => {
              if (node.dataset.requestId === data.requestId) node.remove();
            });
          } else if (frame.name === 'error') {
            setStatus('');
            finishTrace(true);
            showError(data.message || '出错了');
          } else if (frame.name === 'done') {
            setStatus('');
            finishTrace(false);
          }
        }
      }
    } catch (error) {
      setStatus('');
      finishTrace(true);
      showError(error.message || String(error));
    } finally {
      setStatus('');
      finishTrace(userStopped);
      setBusyMode(false);
      input.focus();
      scrollDown();
    }
  }

  // ---------- 提问卡片
  function renderQuestion(payload) {
    const questions = payload.questions || [];
    const card = document.createElement('div');
    card.className = 'question';
    card.dataset.requestId = payload.requestId;
    const picked = new Map();

    for (const question of questions) {
      if (question.header) {
        const head = document.createElement('p');
        head.className = 'detail';
        head.textContent = question.header;
        card.appendChild(head);
      }
      const title = document.createElement('h3');
      title.textContent = question.question || '需要确认一个情况';
      card.appendChild(title);
      if (question.detail) {
        const detail = document.createElement('p');
        detail.className = 'detail';
        detail.textContent = question.detail;
        card.appendChild(detail);
      }
      const options = question.options || [];
      if (options.length) {
        const list = document.createElement('div');
        list.className = 'options';
        for (const option of options) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = option.label;
          if (option.description) button.title = option.description;
          button.onclick = () => {
            const current = picked.get(question.id) || [];
            const label = option.label;
            const next = question.multiSelect
              ? (current.includes(label) ? current.filter((x) => x !== label) : [...current, label])
              : [label];
            picked.set(question.id, next);
            [...list.children].forEach((node) => {
              node.setAttribute('aria-pressed', String(next.includes(node.textContent)));
            });
          };
          button.setAttribute('aria-pressed', 'false');
          list.appendChild(button);
        }
        card.appendChild(list);
      }
      const other = document.createElement('div');
      other.className = 'other';
      const custom = document.createElement('input');
      custom.type = 'text';
      custom.placeholder = options.length ? '也可以直接写补充' : '填写回答';
      custom.setAttribute('aria-label', question.question || '回答');
      other.appendChild(custom);
      card.appendChild(other);
      card.dataset.pending = '1';
      question._input = custom;
    }

    const submit = document.createElement('button');
    submit.type = 'button';
    submit.className = 'submit';
    submit.textContent = '提交回答';
    submit.onclick = async () => {
      const answers = [];
      let missing = false;
      for (const question of questions) {
        const selected = picked.get(question.id) || [];
        const custom = (question._input?.value || '').trim();
        if (!selected.length && !custom) missing = true;
        answers.push(custom ? { id: question.id, selected, custom } : { id: question.id, selected });
      }
      if (missing) { showError('至少要回答一个问题'); return; }
      submit.disabled = true;
      try {
        const response = await fetch('/api/answer', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ requestId: payload.requestId, answers }),
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.error || '回答没有送达');
        }
        card.remove();
        setStatus('正在按你的回答继续…');
      } catch (error) {
        submit.disabled = false;
        showError(error.message || String(error));
      }
    };
    card.appendChild(submit);
    column.appendChild(card);
    scrollDown();
  }

  // ---------- 输入行为
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, Math.round(window.innerHeight * 0.4)) + 'px';
  });
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      submit();
    }
  });
  form.addEventListener('submit', (event) => { event.preventDefault(); submit(); });
  empty.querySelectorAll('button').forEach((button) => {
    button.onclick = () => { input.value = button.textContent; input.focus(); };
  });

  render();
  (async () => {
    try {
      const state = await fetch('/api/health').then((r) => r.json());
      if (!state.ok) { showError(state.error || '后端还没准备好'); return; }
      const fresh = await fetch('/api/new', { method: 'POST' }).then((r) => r.json());
      sessionId = fresh.sessionId;
      input.focus();
    } catch (error) {
      showError('连不上服务：' + (error.message || error));
    }
  })();
})();
</script>
</body>
</html>
